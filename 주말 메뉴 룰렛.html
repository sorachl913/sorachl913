<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주말 메뉴 룰렛</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#EDF2F3;--ink:#1d2b30;--muted:#5a6b72;--surface:#fff;--line:#cbd8dc;--accent:#2F6F8F;--on-accent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13191c;--ink:#e8f0f2;--muted:#9fb0b6;--surface:#1c262a;--line:#2f3d43;--accent:#6bb4d4;--on-accent:#0f1a1e}}
:root[data-theme="dark"]{--bg:#13191c;--ink:#e8f0f2;--muted:#9fb0b6;--surface:#1c262a;--line:#2f3d43;--accent:#6bb4d4;--on-accent:#0f1a1e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:440px;margin:0 auto;padding:24px 20px 40px;text-align:center}
h1{font-size:30px;font-weight:400;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 22px;font-size:16px}
.wheel{position:relative;width:100%;max-width:360px;margin:0 auto}
canvas{display:block;width:100%;height:auto;aspect-ratio:1}
.pointer{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--ink);z-index:2}
#spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:5px solid var(--surface);background:var(--accent);color:var(--on-accent);font:inherit;font-size:20px;cursor:pointer;z-index:2}
#spin:focus-visible,.chip:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#spin:disabled{opacity:.7;cursor:default}
.result{margin:26px auto 6px;min-height:84px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.result .hint{color:var(--muted);font-size:16px}
.result .pick{font-size:30px;line-height:1.3}
.result .note{color:var(--muted);font-size:15px}
.chips-title{margin:26px 0 10px;color:var(--muted);font-size:15px}
.chips{display:grid;gap:8px}
.chip{display:block;width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;text-align:left}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--dot);flex:none}.row{display:flex;align-items:center;gap:8px}.row b{font-weight:400;font-size:17px;flex:1}.row em{font-style:normal;color:var(--muted)}.why{display:block;margin-top:4px;color:var(--muted);font-size:14px;line-height:1.45}
.chip[aria-pressed="false"]{opacity:.45}.chip[aria-pressed="false"] b{text-decoration:line-through}
</style>
</head>
<body>
<main>
  <h1>주말 메뉴 룰렛</h1>
  <p class="sub">고민될 땐 돌려서 정해요.</p>
  <div class="wheel">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="c" width="680" height="680" role="img" aria-label="메뉴 룰렛 판"></canvas>
    <button id="spin" type="button">돌리기</button>
  </div>
  <div class="result" id="result" aria-live="polite"><span class="hint">가운데 버튼을 누르면 메뉴가 정해져요.</span></div>
  <p class="chips-title">숫자는 룰렛 면적 비율이에요. 후보를 눌러 빼거나 넣을 수 있고, 빼면 나머지 비율이 다시 계산돼요.</p>
  <div class="chips" id="chips"></div>
</main>
<script>
(function(){
  var items=[
    {s:"연어회",f:"연어회",w:30,why:"둘 다 회를 좋아하고 마트 최저가 할인 중이라 가장 넓게 잡았어요. 단백질을 채우기 좋고 국물이나 양념이 없어 짠 부담도 적어요. 차가운 음식이라 따뜻한 차를 곁들이면 좋아요.",c:"#E86F5B",t:"#ffffff"},
    {s:"방어회",f:"방어회",w:10,why:"회를 좋아하고 제철 전이라 값이 조금 낮고 맛도 적당한 시기지만, 이틀 전에 먹어서 면적을 줄였어요. 본격 방어철에 다시 노려봐도 좋아요.",c:"#2F6F8F",t:"#ffffff"},
    {s:"등갈비",f:"등갈비",w:22,why:"남편분이 직접 양념 없이 소금구이로 만들어 짠 부담이 크게 줄었어요. 남편분이 좋아하는 따뜻한 단백질이라 면적을 늘렸고, 아내분은 고기가 보통이라 연어회보다는 작게 잡았어요. 소금은 적게 간하면 더 좋아요.",c:"#7A4535",t:"#ffffff"},
    {s:"치킨 배달",f:"후라이드 치킨 배달",w:8,why:"단백질을 채우고 배달이라 가장 간편하지만, 튀김옷과 염지로 짤 수 있고 특별한 한 끼 느낌이 약해서 좁게 잡았어요.",c:"#F2B84B",t:"#2b2111"},
    {s:"구운 치킨",f:"구운 치킨 맛집 외식",w:22,why:"튀기지 않아 후라이드보다 담백한 따뜻한 단백질이라 붓는 걱정을 덜어요. 남편분의 고기 취향에도 맞고 외식이라 특별한 느낌도 있어요.",c:"#5B8C5A",t:"#ffffff"},
    {s:"해장국",f:"해장국 맛집 외식",w:8,why:"남편분이 좋아하는 뜨거운 국밥이고 따뜻한 음식이 당기는 날엔 맞지만, 국물의 나트륨과 수분이 가장 커서 붓는 시기엔 좁게 잡았어요.",c:"#8E5A9B",t:"#ffffff"}
  ];
  var on=items.map(function(){return true;});
  var rot=0, spinning=false, TAU=Math.PI*2;
  var cv=document.getElementById("c"), ctx=cv.getContext("2d");
  var btn=document.getElementById("spin"), res=document.getElementById("result"), chips=document.getElementById("chips");
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function active(){return items.filter(function(_,i){return on[i];});}
  function total(a){return a.reduce(function(s,x){return s+x.w;},0);}

  function draw(){
    var act=active(), n=act.length, tot=total(act), cx=340, cy=340, R=326, a0=rot;
    ctx.clearRect(0,0,680,680);
    for(var i=0;i<n;i++){
      var w=act[i].w/tot*TAU, a1=a0+w;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();
      ctx.fillStyle=act[i].c;ctx.fill();
      ctx.lineWidth=4;ctx.strokeStyle="#ffffff";ctx.stroke();
      ctx.save();ctx.translate(cx,cy);ctx.rotate(a0+w/2);
      ctx.fillStyle=act[i].t;ctx.textAlign="right";ctx.textBaseline="middle";
      ctx.font=(act[i].w/tot<0.1?31:36)+'px "Jua","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
      ctx.fillText(act[i].s,R-30,0);ctx.restore();a0=a1;
    }
    ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.lineWidth=6;ctx.strokeStyle="#ffffff";ctx.stroke();
  }

  function renderChips(){
    chips.innerHTML="";var tot=total(active());
    items.forEach(function(it,i){
      var b=document.createElement("button");
      b.type="button";b.className="chip";b.setAttribute("aria-pressed",String(on[i]));
      b.style.setProperty("--dot",it.c);
      b.innerHTML='<span class="row"><i></i><b>'+it.f+'</b><em>'+(on[i]?Math.round(it.w/tot*100)+'%':'뺌')+'</em></span><span class="why">'+it.why+'</span>';
      b.addEventListener("click",function(){
        if(spinning)return;
        if(on[i]&&active().length<=2){return;}
        on[i]=!on[i];renderChips();draw();
        res.innerHTML='<span class="hint">가운데 버튼을 누르면 메뉴가 정해져요.</span>';
      });
      chips.appendChild(b);
    });
  }

  function spin(){
    if(spinning)return;
    var act=active(), n=act.length, tot=total(act);
    var r=Math.random()*tot, k=0, s0=0;
    while(k<n-1&&r>=s0+act[k].w){s0+=act[k].w;k++;}
    var f=0.15+Math.random()*0.7;
    var base=-Math.PI/2-(s0+f*act[k].w)/tot*TAU;
    var d=(((base-rot)%TAU)+TAU)%TAU+TAU*(5+Math.floor(Math.random()*3));
    var start=rot, dur=reduce?600:4800, t0=null;
    spinning=true;btn.disabled=true;
    res.innerHTML='<span class="hint">돌아가는 중…</span>';
    function step(now){
      if(t0===null)t0=now;
      var t=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-t,4);
      rot=start+d*e;draw();
      if(t<1){requestAnimationFrame(step);}
      else{
        rot=rot%TAU;spinning=false;btn.disabled=false;btn.textContent="다시";
        res.innerHTML='<div class="note">이번 주말 메뉴는</div><div class="pick">'+act[k].f+'</div><div class="note">'+act[k].why+'</div>';
      }
    }
    requestAnimationFrame(step);
  }

  btn.addEventListener("click",spin);
  renderChips();draw();
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(draw);}
})();
</script>
</body>
</html>
